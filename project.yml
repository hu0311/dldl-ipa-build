name: YouyouguH5
options:
  bundleIdPrefix: cn.youyougu
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.25.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: "NO"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  YouyouguH5:
    type: application
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dldl.duxiang225a7f3
        PRODUCT_NAME: YouyouguH5
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        SUPPORTS_MACCATALYST: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

schemes:
  YouyouguH5:
    build:
      targets:
        YouyouguH5: all
    run:
      config: Debug
    archive:
      config: Release
